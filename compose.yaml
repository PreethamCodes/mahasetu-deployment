{
  "name": "mahasetu",
  "services": {
    "scholarship-web": {
      "profiles": [
        "foundation"
      ],
      "build": {
        "context": "../scholarship-portal"
      },
      "environment": {
        "PORT": "3000"
      },
      "ports": [
        "127.0.0.1:${SCHOLARSHIP_WEB_PORT:-3000}:3000"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/health.txt', timeout=2)"
        ],
        "interval": "15s",
        "timeout": "3s",
        "retries": 3
      }
    },
